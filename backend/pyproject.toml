[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-inference"
version = "0.1.0"
description = "Standalone MLflow-backed MNIST inference CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0", "mlflow==3.18.0", "Pillow==11.1.0", "numpy==1.26.4"]

[project.scripts]
vision-infer = "inference_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff==0.17.4", "mypy==2.4.1"]

[tool.uv]
required-version = ">=0.13.7"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/inference_backend"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=inference_backend --cov-config=pyproject.toml --cov-report=term-missing --cov-report=json --cov-report=xml"

[tool.coverage.run]
source = ["inference_backend"]
branch = true
relative_files = true

[tool.coverage.paths]
source = ["src/inference_backend", "*/site-packages/inference_backend"]

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"
